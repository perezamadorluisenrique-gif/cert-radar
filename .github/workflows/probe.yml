name: Probe CT sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        shell: bash
        run: |
          set +e
          O="Origin: https://perezamadorluisenrique-gif.github.io"
          probe() { # label url timeout
            echo "=== $1"
            curl -s -m "$3" -o /tmp/o -D /tmp/h -H "$O" -w "code=%{http_code} time=%{time_total}s size=%{size_download}\n" "$2"
            grep -iE "access-control|content-type|x-ratelimit|retry-after" /tmp/h
            head -c 400 /tmp/o 2>/dev/null; echo
          }
          probe "certspotter letsencrypt.org" "https://api.certspotter.com/v1/issuances?domain=letsencrypt.org&include_subdomains=true&expand=dns_names&expand=issuer" 30
          probe "certspotter github.io-ish small domain" "https://api.certspotter.com/v1/issuances?domain=sslmate.com&include_subdomains=true&expand=dns_names&expand=issuer" 30
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/o'))
          print('certspotter items', len(d)); print(json.dumps(d[0])[:600] if d else '')
          PY
          probe "crt.sh small domain sslmate.com unexpired" "https://crt.sh/?q=%25.sslmate.com&output=json&exclude=expired" 120
          probe "crt.sh small domain sslmate.com full" "https://crt.sh/?q=%25.sslmate.com&output=json" 120
          probe "crt.sh identity letsencrypt.org" "https://crt.sh/?Identity=letsencrypt.org&output=json&exclude=expired" 120
          probe "crt.sh OPTIONS preflight" "https://crt.sh/" 20
          echo done
