name: Probe CT sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: crt.sh CORS and timing
        run: |
          for q in "%25.letsencrypt.org" "%25.wikipedia.org"; do
            echo "=== crt.sh $q"
            curl -s -m 60 -o /tmp/out.json -D - -w "time=%{time_total}s size=%{size_download}\n" \
              -H "Origin: https://perezamadorluisenrique-gif.github.io" \
              "https://crt.sh/?q=$q&output=json&exclude=expired&deduplicate=Y" | grep -iE "^HTTP|access-control|content-type|time=" || true
            head -c 300 /tmp/out.json; echo
          done
      - name: Cert Spotter CORS
        run: |
          curl -s -m 30 -o /tmp/cs.json -D - -w "time=%{time_total}s\n" \
            -H "Origin: https://perezamadorluisenrique-gif.github.io" \
            "https://api.certspotter.com/v1/issuances?domain=letsencrypt.org&include_subdomains=true&expand=dns_names&expand=issuer" | grep -iE "^HTTP|access-control|content-type|time=|ratelimit|retry" || true
          head -c 600 /tmp/cs.json; echo
      - name: crt.sh preflight-free full history timing
        run: |
          curl -s -m 90 -o /tmp/full.json -w "time=%{time_total}s size=%{size_download} code=%{http_code}\n" "https://crt.sh/?q=%25.letsencrypt.org&output=json&deduplicate=Y" || true
