name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily watchlist scan (06:17 UTC), then redeploy with fresh snapshots.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Scan the watchlist
        # A CT outage must never block a deploy; the site shows what it could get.
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/monitor.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERTSPOTTER_TOKEN: ${{ secrets.CERTSPOTTER_TOKEN }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
